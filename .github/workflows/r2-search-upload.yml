# Upload protocol-search shards to the mandat121protocols R2 bucket.
# Manual dispatch only — the standing publisher for corpora the daily
# workflow builds but deliberately never uploads (it owns git commits,
# not the bucket; and its local data/search_c is a 268-sitting fallback
# that must never repoint the bucket's full backfilled corpus).
#
# Default selection is c26,p26 (the K26 corpora the daily accumulates).
# Selecting c or p uploads the checkout verbatim — only do that from a
# tree whose search_c/search_p were freshly rebuilt in full (e.g. the
# committee-backfill job), or the uploader's shrink guard will refuse.
# Credentials: repo secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ENDPOINT (bucket-scoped R2 token).
name: r2-search-upload

on:
  workflow_dispatch:
    inputs:
      corpora:
        description: "Corpora to upload (comma list of c,p,c26,p26)"
        type: string
        default: "c26,p26"
      force:
        description: "Override the shrink guard (deliberate corpus shrink)"
        type: boolean
        default: false
      diagnose:
        description: "Only list the account's buckets (diagnose 404s)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload search shards to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ "${{ inputs.diagnose }}" = "true" ]; then
            python3 -u upload_search_shards.py --diagnose
          else
            ARGS="--corpora ${{ inputs.corpora }}"
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            python3 -u upload_search_shards.py $ARGS
          fi
