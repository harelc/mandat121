# Daily Knesset data build — המנדט ה־121
#
# Scaffolding (started 2026-11-10): refreshes the K25 datasets from the
# official OData and, once the Knesset 26 entities are published there,
# starts building K26 incrementally. All builders are stdlib-only Python
# reading the public OData — no secrets needed.
#
# Flow: probe K26 (per-layer) → refresh K25 layers → build whichever K26
# layers OData has published → commit data/ back if anything changed.
# Every K26 builder below takes --knesset $CURRENT_KNESSET and is a safe no-op (exit 0,
# no write) when its layer is unpublished, so partial publication — e.g.
# factions before bills — builds incrementally instead of failing.
#
# Trigger: Netlify only. GitHub's schedule cron is best-effort (it fired
# ~7h late on 2026-11-10 and not at all on 2026-11-11), and a cron fire
# on top of the Netlify dispatch would queue a duplicate full build, so
# there is deliberately no `schedule:` here. The Netlify scheduled
# function netlify/functions/daily-dispatch.mjs dispatches this workflow
# (target=k26-only: K25 is final) hourly in Israel work hours
# (Sun–Thu 08:00–20:00) and every 4 hours outside them, via
# GITHUB_DISPATCH_TOKEN (Netlify production env). If that token expires,
# runs silently stop — renew it there; a manual workflow_dispatch
# always works.
name: knesset-daily

# The current (live) Knesset, named exactly once. When the next
# Knesset is sworn in: bump this, add one ERAS entry in index.html,
# and every step below follows — no step names an era literal.
env:
  CURRENT_KNESSET: "26"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [all, k25-only, k26-only]
        default: all
      full:
        description: "Also refresh the weekly layers (closed-Knesset history + Wikipedia)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # post-publish change-summary issue (mentions the owner -> GitHub emails it; no mail secrets needed)

concurrency:
  group: knesset-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live data & state from R2
        run: python3 -u upload_data.py pull --knesset $CURRENT_KNESSET --snapshot-dir /tmp/r2_baseline

      - name: Probe Knesset 26 OData
        id: probe
        run: |
          python3 probe_knesset.py --knesset $CURRENT_KNESSET || true # exits 2 until bills publish — never abort this step on it
          # --json prints even on exit 2, so capture it either way and
          # derive per-layer outputs from it.
          python3 probe_knesset.py --knesset $CURRENT_KNESSET --json > probe_k26.json || true
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          try:
              r = json.load(open("probe_k26.json"))["probe"]
          except Exception:
              r = {"ready": False, "any": False, "layers": {}}
          print(f"k26_ready={str(r['ready']).lower()}")
          print(f"k26_any={str(r['any']).lower()}")
          for layer, ok in sorted(r["layers"].items()):
              print(f"k26_{layer}={str(ok).lower()}")
          EOF
          rm -f probe_k26.json
        continue-on-error: true

      - name: Refresh K25 datasets
        if: ${{ inputs.target != 'k26-only' }}
        run: |
          python3 -u build_knesset.py --knesset 25
          python3 -u build_committees.py --knesset 25
          python3 -u build_protocols.py --knesset 25
          # data/mk_contacts.json is the frozen final-K25 roster snapshot —
          # never rebuilt (the MK-lobby feed now serves K26). K26 contacts
          # are built per-Knesset in the K26 step below; build_mk_contacts.py
          # refuses --knesset 25 outright so this can't regress by accident.
          python3 -u build_k25_tenure.py --knesset 25
          # Closed-Knesset history layers: K25 is dissolved, so committee
          # memberships, list order, roles and removed-initiator history
          # no longer change day to day (feed corrections aside). Refresh
          # them weekly (Sundays) or on a manual dispatch with full=true
          # — the same cadence as the Wikipedia layer below — instead of
          # spending ~1.5 min of OData fetches on them every run. (The
          # 8-hourly Netlify dispatch is an ordinary workflow_dispatch,
          # so event name alone must NOT trigger this.) The builders
          # above stay on every run: they are incremental/probe-gated
          # and exit in seconds when nothing changed.
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python3 -u build_k25_committee_members.py --knesset 25
            python3 -u build_k25_list_order.py --knesset 25
            python3 -u build_k25_roles.py --knesset 25          # gov/Knesset/faction leadership roles -> data/k25_roles.json
            python3 -u build_k25_bill_history.py --knesset 25   # removed initiators/sponsors -> data/k25_bill_history.json (after build_knesset: reads k25_bills.json)
          else
            echo "weekly K25 history layers skipped (not a Sunday or full=true run)"
          fi

      - name: Harvest per-MK vote results (K25)
        if: ${{ inputs.target != 'k26-only' }}
        run: python3 -u build_vote_results.py --knesset 25 # resumable; checkpoints to data/k25_vote_results.json

      - name: Derived layers (analytics, contacts/presence, protocol search)
        if: ${{ inputs.target != 'k26-only' }}
        run: |
          # Analytics is a pure function of the vote/bill datasets: only
          # recompute when an earlier step actually changed them (on a
          # no-news day this saves the full 7,451-vote recomputation).
          if git status --porcelain -- data/k25_vote_results.json data/k25_votes.json data/k25_bills.json | grep -q .; then
            python3 -u build_analytics.py          # correlation matrix, close ties, ranks
          else
            echo "analytics inputs unchanged — skipping build_analytics.py"
          fi
          # Wikipedia/Wikidata enrichment changes rarely — refresh weekly
          # (Sundays) or on full=true dispatch, not every run. Non-fatal either
          # way: a Wikipedia 502 must never block the daily data commit
          # (run 42841048758 died exactly that way).
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then python3 -u build_mk_wiki.py || echo "::warning::build_mk_wiki failed — keeping previous Wikipedia abstracts"; fi
          python3 -u build_protocols_search.py   # committee protocol search index
          python3 -u build_plenum_search.py --knesset 25 # plenum (דברי הכנסת) search index — incremental, new sessions only; also writes data/plenum_hl/ highlight residue for new sittings
          # mk_highlights uses a global TF-IDF: one new protocol rescores
          # every MK, so rebuilding hourly churns the file (and triggers a
          # deploy) for no visible gain. Rebuild only every other week
          # (even ISO weeks) or on full=true; determinism is guaranteed by
          # sort_keys + full tie-breakers in build_mk_highlights.py.
          if [ "${{ inputs.full }}" = "true" ] || [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then python3 -u build_mk_highlights.py; else echo "mk_highlights skipped (biweekly layer; even ISO weeks or full=true)"; fi
          python3 -u build_odata_extras.py       # P1 OData extras — probe-gated per section: unchanged sections are reused, so this is seconds on a no-news day
          python3 -u build_agenda.py --knesset 25   # this-week agenda: plenum order of the day + committee sittings (windowed, recess-honest)

      # NOTE: no R2 shard upload here. build_protocols_search.py above
      # rebuilds data/search_c from the 268 pre-parsed protocols only
      # (write_search_shards wipes the dir) — uploading that would
      # regress the bucket's full-corpus index (9,374 protocols, built
      # by committee-backfill.yml) back to 268. Shard uploads are owned
      # by the committee-backfill workflow until the two builders are
      # unified; rerun it (incremental, minutes) to refresh R2 with new
      # sittings. The client falls back to committed shards if R2 lags.

      # K26 layers, in dependency order. Each builder no-ops until its
      # OData layer exists, so this whole step is gated only on "anything
      # published at all" (probe k26_any) — not on bills specifically.
      # Votes are gated on bills OR plenum_votes: a Knesset can publish a
      # plenum vote before its first bill (K26 vote 46716, 2026-11-11,
      # sat unpublished on the site for days because bills was still 0).
      # build_knesset builds bills and vote headers together and is a
      # clean no-op for whichever layer is still empty.
      - name: Build K26 core (bills + vote headers)
        if: ${{ inputs.target != 'k25-only' && (steps.probe.outputs.k26_bills == 'true' || steps.probe.outputs.k26_plenum_votes == 'true') }}
        run: python3 -u build_knesset.py --knesset $CURRENT_KNESSET

      - name: Harvest per-MK vote results (K26)
        if: ${{ inputs.target != 'k25-only' && (steps.probe.outputs.k26_bills == 'true' || steps.probe.outputs.k26_plenum_votes == 'true') }}
        run: python3 -u build_vote_results.py --knesset $CURRENT_KNESSET # resumable; checkpoints to data/k26_vote_results.json

      - name: Build K26 people layers (tenure, list order, committee members)
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_any == 'true' }}
        run: |
          python3 -u build_agenda.py --knesset $CURRENT_KNESSET              # -> data/k26_agenda.json + data/k26_agenda/ (סדר יום pane on the K26 home; incremental window merge)
          python3 -u build_k25_tenure.py --knesset $CURRENT_KNESSET          # -> data/k26_tenure.json (no-op until positions publish)
          python3 -u build_k26_photos_official.py              # -> data/k26_official_photos.json + data/photos/ (portraits for K26 MKs with none yet; no-op until tenure exists)
          python3 -u build_mk_contacts.py --knesset $CURRENT_KNESSET         # -> data/k26_contacts.json (official contact/social/presence snapshot; --knesset 25 is refused, K25 file stays frozen)
          python3 -u build_k25_list_order.py --knesset $CURRENT_KNESSET      # -> data/k26_list_order.json (from CEC preview, works pre-OData)
          python3 -u build_k25_committee_members.py --knesset $CURRENT_KNESSET # -> data/k26_committee_members.json
          python3 -u build_k25_roles.py --knesset $CURRENT_KNESSET             # -> data/k26_roles.json (no-op until positions publish)
          python3 -u build_k25_bill_history.py --knesset $CURRENT_KNESSET      # -> data/k26_bill_history.json (no-op until k26 bills exist)

      - name: Build K26 committees + protocols
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_committee_sessions == 'true' }}
        run: |
          python3 -u build_committees.py --knesset $CURRENT_KNESSET # -> data/k26_committees.json (never touches K25 committees.json)
          python3 -u build_protocols.py --knesset $CURRENT_KNESSET  # -> data/k26_protocols_index.json + shared data/protocols/
          python3 -u build_committee_search.py --knesset $CURRENT_KNESSET # -> data/k26_protocol_search.json + data/search_c26/ (incremental; no-op until protocol docs publish)
          if [ "${{ inputs.full }}" = "true" ] || [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then python3 -u build_mk_highlights.py; else echo "mk_highlights skipped (biweekly layer)"; fi # shared protocol store; biweekly per Derived layers note

      # Plenum sittings (דברי הכנסת) publish independently of bills and
      # committee sessions — gate on their own probe layer, or the K26
      # sittings never reach the site (happened to sittings 1–2, Nov 2026).
      - name: Build K26 plenum search (דברי הכנסת)
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_plenum_sessions == 'true' }}
        run: python3 -u build_plenum_search.py --knesset $CURRENT_KNESSET # -> data/k26_plenum_search.json + data/search_p26/ + data/plenum_hl/

      # Event stream: diff the fresh snapshot against yesterday's and
      # append dated status-change / new-bill / new-vote / new-session
      # events (data/events.json) — the client cannot prove transitions
      # from snapshots alone. Must run after all data builders above.
      - name: Build event stream (diff snapshot)
        run: python3 -u build_events.py

      - name: Publish refreshed data to R2
        id: publish
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Publish live/changing data + builder state directly to Cloudflare R2
          # (zero git commits to main -> zero Netlify deploy credits burned).
          # meaningful_diff filtering, JSON validation, and the 2 GB R2 cap guard
          # all run inside upload_data.py before flipping data-manifest.json.
          python3 -u upload_data.py push --knesset $CURRENT_KNESSET \
            --snapshot-dir /tmp/r2_baseline \
            --changed-out /tmp/r2_changed.json
          # Also keep the live era's protocol/plenum search shards in sync on R2
          # (never touches K25 c/p — those stay owned by committee-backfill.yml).
          python3 -u upload_search_shards.py --corpora "c${CURRENT_KNESSET},p${CURRENT_KNESSET}"
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path("/tmp/r2_changed.json")
          changed = json.loads(p.read_text(encoding="utf-8")) if p.is_file() else []
          print(f"changed={str(bool(changed)).lower()}")
          EOF

      # Mail without mail secrets: GitHub emails issue mentions to the
      # owner under their normal notification settings. The issue is
      # closed immediately — it exists only to carry the summary into
      # the inbox and leave a searchable archive. Non-fatal: the data
      # is already live on R2, a notification failure must not fail the run.
      - name: Notify owner of the data refresh (summary issue)
        if: ${{ steps.publish.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.repository_owner }} — \`knesset-daily\` just published refreshed Knesset data to Cloudflare R2 (no Netlify deploy)."
            echo
            python3 summarize_commit.py --baseline /tmp/r2_baseline --changed /tmp/r2_changed.json
            echo
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "_Auto-closed: this issue is only an email notification + archive._"
          } > notify-body.md
          # Title carries the headline (e.g. "2 new committee sessions, 1 new
          # bill"), not just the date — it's all the email subject shows.
          title=$(python3 summarize_commit.py --baseline /tmp/r2_baseline --changed /tmp/r2_changed.json --title || echo "data refresh $(date -u +%Y-%m-%d) — published to R2")
          url=$(gh issue create --title "$title" --body-file notify-body.md)
          echo "Notification issue: $url"
          gh issue close "$url" --comment "Data already live on R2 — closing; this issue was the email notification." \
            || echo "::warning::Could not auto-close $url — close it manually."
