# Daily Knesset data build — המנדט ה־121
#
# Scaffolding (started 2026-11-10): refreshes the K25 datasets from the
# official OData and, once the Knesset 26 entities are published there,
# starts building K26 incrementally. All builders are stdlib-only Python
# reading the public OData — no secrets needed.
#
# Flow: probe K26 (per-layer) → refresh K25 layers → build whichever K26
# layers OData has published → commit data/ back if anything changed.
# Every K26 builder below takes --knesset 26 and is a safe no-op (exit 0,
# no write) when its layer is unpublished, so partial publication — e.g.
# factions before bills — builds incrementally instead of failing.
#
# Trigger: Netlify only. GitHub's schedule cron is best-effort (it fired
# ~7h late on 2026-11-10 and not at all on 2026-11-11), and a cron fire
# on top of the Netlify dispatch would queue a duplicate full build, so
# there is deliberately no `schedule:` here. The Netlify scheduled
# function netlify/functions/daily-dispatch.mjs dispatches this workflow
# (target=k26-only: K25 is final) hourly in Israel work hours
# (Sun–Thu 08:00–20:00) and every 4 hours outside them, via
# GITHUB_DISPATCH_TOKEN (Netlify production env). If that token expires,
# runs silently stop — renew it there; a manual workflow_dispatch
# always works.
name: knesset-daily

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options: [all, k25-only, k26-only]
        default: all
      full:
        description: "Also refresh the weekly layers (closed-Knesset history + Wikipedia)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write # post-push change-summary issue (mentions the owner -> GitHub emails it; no mail secrets needed)

concurrency:
  group: knesset-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe Knesset 26 OData
        id: probe
        run: |
          python3 probe_knesset.py || true # exits 2 until bills publish — never abort this step on it
          # --json prints even on exit 2, so capture it either way and
          # derive per-layer outputs from it.
          python3 probe_knesset.py --json > probe_k26.json || true
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          try:
              r = json.load(open("probe_k26.json"))["probe"]
          except Exception:
              r = {"ready": False, "any": False, "layers": {}}
          print(f"k26_ready={str(r['ready']).lower()}")
          print(f"k26_any={str(r['any']).lower()}")
          for layer, ok in sorted(r["layers"].items()):
              print(f"k26_{layer}={str(ok).lower()}")
          EOF
          rm -f probe_k26.json
        continue-on-error: true

      - name: Refresh K25 datasets
        if: ${{ inputs.target != 'k26-only' }}
        run: |
          python3 -u build_knesset.py --knesset 25
          python3 -u build_committees.py --knesset 25
          python3 -u build_protocols.py --knesset 25
          # data/mk_contacts.json is the frozen final-K25 roster snapshot —
          # never rebuilt (the MK-lobby feed now serves K26). K26 contacts
          # are built per-Knesset in the K26 step below; build_mk_contacts.py
          # refuses --knesset 25 outright so this can't regress by accident.
          python3 -u build_k25_tenure.py --knesset 25
          # Closed-Knesset history layers: K25 is dissolved, so committee
          # memberships, list order, roles and removed-initiator history
          # no longer change day to day (feed corrections aside). Refresh
          # them weekly (Sundays) or on a manual dispatch with full=true
          # — the same cadence as the Wikipedia layer below — instead of
          # spending ~1.5 min of OData fetches on them every run. (The
          # 8-hourly Netlify dispatch is an ordinary workflow_dispatch,
          # so event name alone must NOT trigger this.) The builders
          # above stay on every run: they are incremental/probe-gated
          # and exit in seconds when nothing changed.
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            python3 -u build_k25_committee_members.py --knesset 25
            python3 -u build_k25_list_order.py --knesset 25
            python3 -u build_k25_roles.py --knesset 25          # gov/Knesset/faction leadership roles -> data/k25_roles.json
            python3 -u build_k25_bill_history.py --knesset 25   # removed initiators/sponsors -> data/k25_bill_history.json (after build_knesset: reads k25_bills.json)
          else
            echo "weekly K25 history layers skipped (not a Sunday or full=true run)"
          fi

      - name: Harvest per-MK vote results (K25)
        if: ${{ inputs.target != 'k26-only' }}
        run: python3 -u build_k25_vote_results.py --knesset 25 # resumable; checkpoints to data/k25_vote_results.json

      - name: Derived layers (analytics, contacts/presence, protocol search)
        if: ${{ inputs.target != 'k26-only' }}
        run: |
          # Analytics is a pure function of the vote/bill datasets: only
          # recompute when an earlier step actually changed them (on a
          # no-news day this saves the full 7,451-vote recomputation).
          if git status --porcelain -- data/k25_vote_results.json data/k25_votes.json data/k25_bills.json | grep -q .; then
            python3 -u build_analytics.py          # correlation matrix, close ties, ranks
          else
            echo "analytics inputs unchanged — skipping build_analytics.py"
          fi
          # Wikipedia/Wikidata enrichment changes rarely — refresh weekly
          # (Sundays) or on full=true dispatch, not every run. Non-fatal either
          # way: a Wikipedia 502 must never block the daily data commit
          # (run 42841048758 died exactly that way).
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then python3 -u build_mk_wiki.py || echo "::warning::build_mk_wiki failed — keeping previous Wikipedia abstracts"; fi
          python3 -u build_protocols_search.py   # committee protocol search index
          python3 -u build_plenum_search.py      # plenum (דברי הכנסת) search index — incremental, new sessions only; also writes data/plenum_hl/ highlight residue for new sittings
          # mk_highlights uses a global TF-IDF: one new protocol rescores
          # every MK, so rebuilding hourly churns the file (and triggers a
          # deploy) for no visible gain. Rebuild only every other week
          # (even ISO weeks) or on full=true; determinism is guaranteed by
          # sort_keys + full tie-breakers in build_mk_highlights.py.
          if [ "${{ inputs.full }}" = "true" ] || [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then python3 -u build_mk_highlights.py; else echo "mk_highlights skipped (biweekly layer; even ISO weeks or full=true)"; fi
          python3 -u build_odata_extras.py       # P1 OData extras — probe-gated per section: unchanged sections are reused, so this is seconds on a no-news day
          python3 -u build_agenda.py             # this-week agenda: plenum order of the day + committee sittings (windowed, recess-honest)

      # K26 layers, in dependency order. Each builder no-ops until its
      # OData layer exists, so this whole step is gated only on "anything
      # published at all" (probe k26_any) — not on bills specifically.
      - name: Build K26 core (bills + vote headers)
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_bills == 'true' }}
        run: python3 -u build_knesset.py --knesset 26

      - name: Harvest per-MK vote results (K26)
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_bills == 'true' }}
        run: python3 -u build_k25_vote_results.py --knesset 26 # resumable; checkpoints to data/k26_vote_results.json

      - name: Build K26 people layers (tenure, list order, committee members)
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_any == 'true' }}
        run: |
          python3 -u build_agenda.py --knesset 26              # -> data/k26_agenda.json + data/k26_agenda/ (סדר יום pane on the K26 home; incremental window merge)
          python3 -u build_k25_tenure.py --knesset 26          # -> data/k26_tenure.json (no-op until positions publish)
          python3 -u build_k26_photos_official.py              # -> data/k26_official_photos.json + data/photos/ (portraits for K26 MKs with none yet; no-op until tenure exists)
          python3 -u build_mk_contacts.py --knesset 26         # -> data/k26_contacts.json (official contact/social/presence snapshot; --knesset 25 is refused, K25 file stays frozen)
          python3 -u build_k25_list_order.py --knesset 26      # -> data/k26_list_order.json (from CEC preview, works pre-OData)
          python3 -u build_k25_committee_members.py --knesset 26 # -> data/k26_committee_members.json
          python3 -u build_k25_roles.py --knesset 26             # -> data/k26_roles.json (no-op until positions publish)
          python3 -u build_k25_bill_history.py --knesset 26      # -> data/k26_bill_history.json (no-op until k26 bills exist)

      - name: Build K26 committees + protocols
        if: ${{ inputs.target != 'k25-only' && steps.probe.outputs.k26_committee_sessions == 'true' }}
        run: |
          python3 -u build_committees.py --knesset 26 # -> data/k26_committees.json (never touches K25 committees.json)
          python3 -u build_protocols.py --knesset 26  # -> data/k26_protocols_index.json + shared data/protocols/
          if [ "${{ inputs.full }}" = "true" ] || [ $((10#$(date -u +%V) % 2)) -eq 0 ]; then python3 -u build_mk_highlights.py; else echo "mk_highlights skipped (biweekly layer)"; fi # shared protocol store; biweekly per Derived layers note

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "mandat121-data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every commit to main triggers a Netlify deploy, so don't let
          # build-timestamp churn (agenda generated_at, contacts/wiki
          # fetched_at) or re-serialization noise create one: restore
          # files whose staged diff is semantically empty, and skip the
          # commit entirely when nothing meaningful remains.
          python3 meaningful_diff.py
          if git diff --cached --quiet; then
            echo "Only timestamps/formatting changed — no commit, no deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: daily OData refresh ($(date -u +%Y-%m-%d))"
          # The build takes ~an hour; main can move under us (human pushes).
          # A bare push then dies non-fast-forward and loses the whole run's
          # data (happened 2026-11-10, run 42819693977). Rebase our data-only
          # commit onto the latest main and retry; a rebase *conflict* still
          # fails loudly — never silently overwrite a human data change with
          # a build snapshot.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase of the data commit onto latest main conflicted (attempt $attempt) — refusing to force it; tomorrow's run will rebuild on top."
              exit 1
            fi
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (main moved again), retrying…"
          done
          echo "::error::Could not push after 3 attempts — main kept moving."
          exit 1

      # Mail without mail secrets: GitHub emails issue mentions to the
      # owner under their normal notification settings. The issue is
      # closed immediately — it exists only to carry the summary into
      # the inbox and leave a searchable archive. Non-fatal: the data
      # is already pushed, a notification failure must not fail the run.
      - name: Notify owner of the data commit (summary issue)
        if: ${{ steps.commit.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          {
            echo "@${{ github.repository_owner }} — \`knesset-daily\` just pushed a data commit to \`main\`."
            echo
            python3 summarize_commit.py "$sha"
            echo
            echo "**Commit:** ${{ github.server_url }}/${{ github.repository }}/commit/$sha"
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "_Auto-closed: this issue is only an email notification + archive._"
          } > notify-body.md
          title="data refresh $(git log -1 --format=%cs "$sha") — pushed to main"
          url=$(gh issue create --title "$title" --body-file notify-body.md)
          echo "Notification issue: $url"
          gh issue close "$url" --comment "Data already on main — closing; this issue was the email notification." \
            || echo "::warning::Could not auto-close $url — close it manually."
